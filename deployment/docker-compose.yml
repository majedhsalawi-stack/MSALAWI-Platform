services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: msalawi
      POSTGRES_USER: msalawi
      POSTGRES_PASSWORD: msalawi_local_only
    ports:
      - "5432:5432"
    volumes:
      - msalawi_postgres:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: source/Presentation/Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Primary: Host=postgres;Port=5432;Database=msalawi;Username=msalawi;Password=msalawi_local_only
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  msalawi_postgres:
