services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: msalawi
      POSTGRES_USER: msalawi
      POSTGRES_PASSWORD: msalawi_local_only
    ports:
      - "5432:5432"
    volumes:
      - msalawi_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msalawi -d msalawi"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: source/Presentation/Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MSALAWI: Host=postgres;Port=5432;Database=msalawi;Username=msalawi;Password=msalawi_local_only
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  msalawi_postgres:
